services:
  - type: web
    name: stylework-lead-tracker-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
